name: ci
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: write   # 러너 jar 롤링 릴리스(runner-latest) 태그·자산 갱신
  packages: write   # GHCR 이미지 push

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '24'
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew
      # 이미지 버전 스탬프 — /actuator/info의 build.version이 이 값이 되고,
      # 관리자 대시보드 헬스 집계 표의 "버전" 열이 그걸 읽는다.
      # 형식 <짧은sha 7자리>-<YYYYMMDD>. GHCR의 sha-<전체sha> 태그와 같은 커밋을 가리킨다.
      - name: Version stamp
        id: ver
        run: echo "app=${GITHUB_SHA::7}-$(date -u +%Y%m%d)" >> "$GITHUB_OUTPUT"
      # 서비스 + worker-core + runner 전 모듈 빌드·테스트. 러너 jar(runner/build/libs/agent-runner.jar)의 Implementation-Version도 이 스탬프다.
      - run: ./gradlew build --no-daemon -PappVersion=${{ steps.ver.outputs.app }}
        env:
          GITHUB_ACTOR: chanho4702
          GITHUB_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN }}

      - name: Upload runner jar artifact
        uses: actions/upload-artifact@v4
        with:
          name: agent-runner-${{ steps.ver.outputs.app }}
          path: runner/build/libs/agent-runner.jar
          if-no-files-found: error

      - name: Login GHCR
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # buildx + gha 캐시: 워커 이미지(AGP-68)의 node·claude·apt 층은 버전 고정이라 커밋마다 다시 받을 이유가 없다 — jar 층만 바뀐다.
      - name: Set up Buildx
        if: github.ref == 'refs/heads/main'
        uses: docker/setup-buildx-action@v3

      - name: Build & push image
        if: github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          # 서비스 이미지와 러너 이미지의 캐시가 서로 밀어내지 않게 scope를 나눈다
          cache-from: type=gha,scope=agent-service
          cache-to: type=gha,mode=max,scope=agent-service
          tags: |
            ghcr.io/chanho4702/agent-service:latest
            ghcr.io/chanho4702/agent-service:sha-${{ github.sha }}

      # 플랫폼 러너 이미지(AGP-69 T3 — 비밀 없는 서버 실행기, CLAUDE.md §12·§13). node·claude·apt 층은 버전 고정이라 캐시로 재사용된다.
      - name: Build & push runner image
        if: github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: runner/Dockerfile
          push: true
          cache-from: type=gha,scope=agent-runner
          cache-to: type=gha,mode=max,scope=agent-runner
          tags: |
            ghcr.io/chanho4702/agent-runner:latest
            ghcr.io/chanho4702/agent-runner:sha-${{ github.sha }}

      # 사용자 PC용 러너 jar — 고정 URL(설정 화면이 링크한다):
      #   https://github.com/chanho4702/agent-service/releases/download/runner-latest/agent-runner.jar
      # 롤링 릴리스: 태그를 이 커밋으로 옮기고 자산을 덮어쓴다.
      - name: Publish runner jar (rolling release runner-latest)
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APP_VERSION: ${{ steps.ver.outputs.app }}
        run: |
          cd runner/build/libs
          sha256sum agent-runner.jar > agent-runner.jar.sha256
          git tag -f runner-latest "$GITHUB_SHA"
          git push -f origin refs/tags/runner-latest
          NOTES="agent-runner ${APP_VERSION} (commit ${GITHUB_SHA}) — 실행: java -jar agent-runner.jar --server <플랫폼 주소> (토큰은 RUNNER_TOKEN env). Java 24 필요."
          if gh release view runner-latest >/dev/null 2>&1; then
            gh release upload runner-latest agent-runner.jar agent-runner.jar.sha256 --clobber
            gh release edit runner-latest --title "agent-runner (latest)" --notes "$NOTES"
          else
            gh release create runner-latest agent-runner.jar agent-runner.jar.sha256 --title "agent-runner (latest)" --notes "$NOTES" --latest
          fi

      - name: Dispatch deploy
        if: github.ref == 'refs/heads/main' && vars.DEPLOY_ENABLED == 'true'
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.DISPATCH_PAT }}
          repository: chanho4702/infra-settings
          event-type: deploy
          client-payload: '{"service":"agent-service","sha":"${{ github.sha }}","run_id":"${{ github.run_id }}","repo":"${{ github.repository }}"}'
