server:
  port: 9160
spring:
  application:
    name: agent-service
  cloud:
    discovery:
      client:
        # 서비스 health는 자기 상태(db)만 본다 — 유레카/디스커버리 상태는 게이트웨이 대시보드가
        # eureka 컴포넌트로 따로 프로브한다(설계 §3). 켜 두면 유레카가 잠깐 흔들릴 때
        # 서비스 전체가 DOWN으로 보인다.
        health-indicator:
          enabled: false
  ai:
    mcp:
      server:
        name: platform-agent
        version: 0.1.0
        protocol: STREAMABLE          # SSE 아님 — 2.0 기본
        streamable-http:
          mcp-endpoint: /api/agent/mcp
        instructions: >
          플랫폼 ALM·Wiki 기록 도구다. 규약: (1) 작업 시작 전 get_project_context로 스킴·명단 확인,
          (2) 이슈를 집으면 claim_issue, 진행 코멘트는 add_comment, 시간은 log_work,
          (3) 결정·설계·작업 내용은 위키에 create_page/append_to_page로 페르소나 명의의 작업
          보고서를 남기고 add_comment로 이슈에 링크한다 — 보고서 없는 완료는 금지,
          (4) PR은 link_pr로 연결, (5) 완료 시 작업 보고서 링크 코멘트 → update_issue_status(done 계열) 순서,
          (6) 이슈 제목·설명·우선순위 수정은 update_issue(넘긴 필드만 바뀐다).
          모든 기록은 현재 페르소나 명의로 남는다.
  # 모든 자격증명/URL은 env로 오버라이드 가능. 기본값은 로컬 dev 전용 — 운영에서는 반드시 주입.
  datasource:
    url: ${AGENT_DB_URL:jdbc:postgresql://localhost:5433/agentdb}
    username: ${AGENT_DB_USERNAME:keycloak}
    password: ${AGENT_DB_PASSWORD:keycloak}
  jpa:
    hibernate:
      ddl-auto: validate        # 스키마 변경은 Flyway로만
    open-in-view: false
  flyway:
    enabled: true
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${AUTH_JWKS_URI:http://localhost:9000/.well-known/jwks.json}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URI:http://localhost:8761/eureka}
  instance:
    # Windows/사설망에서 DNS 해석 불가 호스트명 등록 시 게이트웨이 lb:// 해석이 죽는다 — IP로 등록 (E2E 실측).
    prefer-ip-address: true

platform:
  jwt:
    # auth-server 자체 AT의 issuer/audience — common-starter가 이 두 값으로 검증기를 만든다.
    issuer: ${PLATFORM_ISSUER:http://localhost:9000}
    audience: ${PLATFORM_AUDIENCE:platform-api}
  agent:
    auth-base-url: ${AUTH_BASE_URL:http://localhost:9000}
    alm-base-url: ${ALM_BASE_URL:http://localhost:9120}
    wiki-base-url: ${WIKI_BASE_URL:http://localhost:9110}
    org-base-url: ${ORG_BASE_URL:http://localhost:9130}
    internal-secret: ${AGENT_INTERNAL_SECRET:}   # 비면 페르소나 토큰 발급 불가(fail-closed)
    worker:
      # 워커 런처(P2a T3) — 이슈를 헤드리스 `claude -p` 프로세스로 실행한다. 전부 env로 오버라이드.
      work-dir: ${AGENT_WORK_DIR:C:\agent-work}
      harness-bundle-path: ${HARNESS_BUNDLE:C:\MSA_TEMPLATE\.claude}
      harness-root-files: ${HARNESS_ROOT_FILES:C:\MSA_TEMPLATE\CLAUDE.md,C:\MSA_TEMPLATE\AGENTS.md}
      claude-bin: ${CLAUDE_BIN:claude}
      max-turns: ${WORKER_MAX_TURNS:80}
      timeout-minutes: ${WORKER_TIMEOUT_MIN:40}
      allowed-tools: 'Read,Edit,Write,Glob,Grep,Bash(git *),Bash(gradlew *),Bash(./gradlew *),Bash(npm *),Bash(pnpm *),Agent,mcp__agent-platform__*'
      mcp-url: ${WORKER_MCP_URL:http://localhost/api/agent/mcp}
      # 프로젝트키→git URL 매핑, env/yml/프로그램 인자로 주입 (예: AGP: https://github.com/chanho4702/agent-service.git)
      # 주의(F3, task-7 E2E 실측): PLATFORM_AGENT_WORKER_REPOS_AGP=... 같은 env var로 넘기면
      # Spring Boot relaxed binding이 맵 키를 소문자로 접는다(repos.get("agp"), "AGP" 아님) —
      # ALM 프로젝트 키는 항상 대문자라 그 경로로 주입하면 매번 "리포 매핑 없음"이 난다.
      # WorkerProperties.repoFor(key)가 대소문자 무관 조회로 이 문제를 흡수하지만, env var로
      # 주입할 땐 --args="--platform.agent.worker.repos.AGP=..."(프로그램 인자, 대소문자 보존)
      # 나 이 YAML처럼 직접 쓰는 쪽을 우선한다.
      repos: {}
      # env 커튼(AGP-48) — 워커·git clone 자식은 부모 env를 상속하지 않고 OS 구동 최소 세트
      # (ProcessCommandExecutor.BASE_ALLOWED_KEYS)만 받는다. 온프렘에서 프록시(HTTP_PROXY·HTTPS_PROXY·NO_PROXY)나
      # 사내 CA(NODE_EXTRA_CA_CERTS·GIT_SSL_CAINFO), Git Bash 위치 고정(CLAUDE_CODE_GIT_BASH_PATH) 같은 키가 더 필요하면
      # 여기 이름만 추가한다(값은 부모 env에서, 대소문자 무관).
      # 자격증명 키를 넣으면 워커(외부 입력으로 프롬프트가 구성되는 LLM)에 그대로 노출된다는 점을 알고 넣을 것.
      # env: WORKER_EXTRA_ENV_KEYS=HTTP_PROXY,HTTPS_PROXY,NO_PROXY
      extra-env-keys: ${WORKER_EXTRA_ENV_KEYS:}
    scheduler:
      # 디스패처(P2a T4) — 무인 자동화 루프. 기본 OFF(킬스위치), 반드시 명시적으로 켠다.
      enabled: ${SCHEDULER_ENABLED:false}
      interval-ms: ${SCHEDULER_INTERVAL_MS:60000}
      max-concurrent-global: ${SCHEDULER_MAX_GLOBAL:2}
      max-concurrent-per-project: ${SCHEDULER_MAX_PER_PROJECT:1}
      default-persona-slug: ${SCHEDULER_PERSONA:jiho}
      retry-max-attempts: ${SCHEDULER_RETRY_MAX_ATTEMPTS:3}
      # 새 이슈 픽업이 한 틱에 넘겨 보는 검색 페이지 상한(AGP-52) — 앞 페이지가 전부 걸러져도 뒤 후보가 굶지 않게.
      max-pick-pages: ${SCHEDULER_MAX_PICK_PAGES:5}
      # 자동화 run 모델 정책(P2c) — 프로젝트별 맵 > 이 전역 기본 > 비움(워커 기본 모델).
      # 프로젝트별은 project-models.<프로젝트키> 또는 env PLATFORM_AGENT_SCHEDULER_PROJECT_MODELS_<KEY>(키 대소문자 무관).
      default-model: ${SCHEDULER_DEFAULT_MODEL:}
    review:
      # 리뷰 run 상시화(P2c T3, 스펙 §10.4-4 "검증 없는 확정 없음") — TASK run이 DONE이면 리뷰어 페르소나가
      # 같은 워크스페이스의 로컬 커밋을 검증하는 REVIEW run이 뒤따른다. 이슈 done 전환은 리뷰 통과 시 리뷰어만 한다.
      # false는 레거시 복원(TASK 워커가 직접 done 전환) — 명시적으로 끌 때만.
      enabled: ${REVIEW_ENABLED:true}
      # 리뷰어 페르소나 슬러그. 비었거나 없는 페르소나면 리뷰를 못 띄우므로 이슈를 inprogress로 남기고 경고 코멘트(fail-closed).
      persona-slug: ${REVIEW_PERSONA:}
      # REVIEW run 모델. 비우면 scheduler의 project-models > default-model > 워커 기본 순을 따른다.
      model: ${REVIEW_MODEL:}
    meetings:
      # 회의 run(P3b, 스펙 §6) — MEETING(착수/계획)·RETRO(회고)·ESCALATION. 워커가 참석 페르소나를 롤플레이해 회의록을 위키에 쓴다.
      # 회의록을 쓰는 위키 스페이스 id. 비면 회의 소집 API는 400, 회고 cron·자동 에스컬레이션은 건너뛴다.
      # 워커 페르소나(진행자)에게 이 스페이스 EDITOR grant가 있어야 create_page가 성공한다.
      space-id: ${MEETING_SPACE_ID:}
      # 회고 주기 — Spring cron 6필드, Asia/Seoul(예: "0 0 18 * * MON-FRI"). 비우면 꺼짐.
      # SCHEDULER_ENABLED=false여도 이것만 켜면 동작한다. repos 매핑의 프로젝트마다 RETRO run 하나.
      retro-cron: ${MEETING_RETRO_CRON:}
      # BLOCKED 승격(재시도 한도·리뷰 반려 한도) 시 ESCALATION 회의 run 자동 생성. 기본 off — BLOCKED마다 회의 비용이 붙는다.
      auto-escalation: ${MEETING_AUTO_ESCALATION:false}
      # 회의 결정→이슈를 워커가 create_issue로 직접 만든다. false면 PLAN 게이트로 사람 승인 후 이어받은 run이 만든다.
      auto-issue: ${MEETING_AUTO_ISSUE:true}
    budget:
      # 예산 캡(P2a T5) — BudgetService가 BudgetGuardConfig의 permissive 기본값을 대체한다.
      # 월 캡은 캘린더 월(UTC) 누적, 플랫폼 전체와 프로젝트별에 같은 값을 쓴다(P2a 결정,
      # 프로젝트별 개별 한도는 P2b). 킬 스위치(POST /api/agent/kill-switch)는 인메모리라
      # 재기동 시 리셋된다 — 여기 값과 무관하게 항상 꺼진 상태로 시작한다.
      monthly-usd-cap: ${BUDGET_MONTHLY_USD:100}
      per-run-usd-cap: ${BUDGET_PER_RUN_USD:5}

# Actuator — 내부망 전용. 게이트웨이 관리자 대시보드(/api/platform/health)가 20초 캐시로 프로브한다.
# health·info 둘만 노출하고(SecurityConfig의 전용 체인에서 이 둘만 permitAll), 관리 포트는 따로
# 두지 않는다. 외부 의존(auth·alm·wiki·org REST)은 인디케이터로 넣지 않는다 — 프로브가 하위
# 서비스로 번지면 안 된다.
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always   # 게이트웨이가 components.db 상태를 읽는다
  info:
    build:
      enabled: true          # springBoot { buildInfo() }가 만든 build-info.properties
  health:
    eureka:
      enabled: false         # 위와 같은 이유 — 유레카는 대시보드가 따로 본다

---
spring:
  config:
    activate:
      on-profile: docker
# docker 프로필: Eureka 미등록(게이트웨이가 AGENT_SERVICE_URI DNS 직결 — org/search 패턴)
eureka:
  client:
    enabled: false
logging:
  # 컨테이너에서는 stdout JSON. Alloy가 긁어 Loki로 보낸다. 앱에서 Loki 직결 금지.
  structured:
    format:
      console: ecs
