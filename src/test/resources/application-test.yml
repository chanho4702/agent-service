spring:
  datasource:
    url: jdbc:h2:mem:agentdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop
  flyway:
    enabled: false
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: http://localhost:9000/.well-known/jwks.json

# 단위 테스트는 유레카 서버 없이 돈다
eureka:
  client:
    enabled: false

platform:
  # 러너 생존 판정·PAT 만료 알림 주기 작업이 컨텍스트 테스트 중에 돌지 않게 — 정책은 서비스 단위 테스트가 직접 부른다.
  agent:
    maintenance:
      enabled: false
  jwt:
    issuer: http://localhost:9000
    audience: platform-api
  # 권한 판정을 목으로 바꾸지 않은 테스트가 실수로 org를 부르면 오래 기다리지 않고 바로 fail-closed가 나게 한다
  org-grpc:
    host: localhost
    port: 1
    deadline-seconds: 1
